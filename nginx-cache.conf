# -------------------------------------------------------------------------------
# Static asset caching + compression for the resume site.
#
# conf.d/*.conf is included from the http context by the stock nginx.conf, so
# these directives apply to the default server without replacing default.conf.
#
# The site is three files and no images, so this is mostly here for gzip --
# it takes the ~33KB of html/css/js down to roughly a quarter of that. HTML
# always revalidates so a redeploy is visible immediately.
# -------------------------------------------------------------------------------

map $sent_http_content_type $asset_expires {
    default                   off;
    text/html                 epoch;
    text/css                  1y;
    text/javascript           1y;
    application/javascript    1y;
    application/json          1h;
    ~image/                   30d;
    ~font/                    1y;
}

expires $asset_expires;

gzip              on;
gzip_vary         on;
gzip_min_length   1024;
gzip_comp_level   6;
gzip_proxied      any;
gzip_types
    text/plain
    text/css
    text/javascript
    text/xml
    application/javascript
    application/json
    application/xml
    application/rss+xml
    image/svg+xml
    font/ttf
    font/otf;
